# Portal Cuba Corp — Deployment Workflow Skeleton
# Inception baseline: structure only, steps filled in during Elaboration/Construction
# Deployment target: internal Windows Server (CON-006), single node

name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_NAME: 'PortalCubaCorp'

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal
      - name: Publish
        run: dotnet publish --configuration Release --no-build --output ./publish
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-deployable
          path: ./publish

  deploy:
    name: Deploy to Windows Server
    needs: build
    runs-on: windows-latest
    environment: production
    steps:
