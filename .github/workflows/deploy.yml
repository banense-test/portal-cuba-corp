# Deployment workflow — Portal Cuba Corp
# .NET 10 / Razor Pages / PostgreSQL on internal Windows Server (CON-006)
#
# Triggers:
#   - Push to main: build + test (no auto-deploy)
#   - Version tag (v*): build + test + publish + create release artifact
#
# Deployment to the Windows Server is manual via deploy/deploy.ps1
# Rollback is manual via deploy/rollback.ps1
# This is intentional — the target is an internal Windows Server (CON-006)
# with no cloud CI/CD runner access.

name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Regenerate solution from src/ and tests/
        run: |
          rm -f *.sln
          dotnet new sln
          find src tests -name '*.csproj' -exec dotnet sln add {} +
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test --no-restore --configuration Release --logger trx --results-directory ./TestResults

  publish:
    name: Publish Release Artifact
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Regenerate solution
        run: |
          rm -f *.sln
          dotnet new sln
          find src tests -name '*.csproj' -exec dotnet sln add {} +
      - name: Publish
        run: |
          dotnet publish src/PortalCubaCorp/PortalCubaCorp.csproj \
            -c Release \
            -o ./publish \
            --self-contained false
      - name: Create deployment package
        run: |
          cd publish
          zip -r ../portal-cuba-corp-${{ github.ref_name }}.zip .
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-cuba-corp-${{ github.ref_name }}
          path: portal-cuba-corp-${{ github.ref_name }}.zip
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: portal-cuba-corp-${{ github.ref_name }}.zip
          generate_release_notes: true

  # Deployment to the internal Windows Server is manual.
  # The release artifact from the 'publish' job is downloaded and
  # deployed using deploy/deploy.ps1 on the target server.
  # Rollback uses deploy/rollback.ps1.
  #
  # Rollback criteria (per docs/DEPLOYMENT_STRATEGY.md):
  #   - Portal unavailable >30 min during business hours (NFR-003)
  #   - Clocking data corruption or loss
  #   - Keycloak OIDC integration failure
  #   - AD LDAP connectivity failure